<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sri Devi Groups - Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
</head>
<body>
    <!-- Page Loader -->
    <div class="page-loader">
        <div class="loader"></div>
    </div>

    <!-- Floating Shapes -->
    <div class="floating-shape"></div>
    <div class="floating-shape"></div>
    <div class="floating-shape"></div>

    <!-- Login Page -->
    <section class="login-page">
        <div class="login-container">
            <div class="login-logo">
                <div class="logo-icon">SD</div>
                <h1>Sri Devi Groups</h1>
                <p>Welcome back! Please login to continue.</p>
            </div>

            <div id="login-error" class="login-error"></div>

            <form class="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <div class="form-options">
                    <label>
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-gold login-btn">
                    Login to Dashboard →
                </button>
            </form>

            <div style="text-align: center; margin-top: 25px; color: rgba(255,255,255,0.4); font-size: 0.8rem;">
                <p>Demo: <strong style="color: var(--gold);">admin</strong> / <strong style="color: var(--gold);">admin123</strong></p>
            </div>
        </div>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
